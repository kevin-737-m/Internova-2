<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Flexbox Layout</title>

    <link rel="stylesheet"
        href="task3_style.css">

</head>

<body>

    <header>

        <h1>Flexbox Layout</h1>

        <nav>

            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Courses</a>
            <a href="#">Contact</a>

        </nav>

    </header>


    <main>

        <h2>Learning Paths</h2>


        <section class="flex-container">

            <div class="flex-card">

                <h3>Frontend</h3>

                <p>
                    Learn HTML, CSS, JavaScript and React.
                </p>

                <button>Learn More</button>

            </div>


            <div class="flex-card">

                <h3>Backend</h3>

                <p>
                    Learn Node.js, Express and databases.
                </p>

                <button>Learn More</button>

            </div>


            <div class="flex-card">

                <h3>Full Stack</h3>

                <p>
                    Combine frontend and backend technologies.
                </p>

                <button>Learn More</button>

            </div>

        </section>

    </main>

</body>

</html>
