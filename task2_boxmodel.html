<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Box Model</title>

    <link rel="stylesheet" href="task2_style.css">

</head>

<body>

    <header>

        <h1>CSS Box Model</h1>

        <p>Understanding Width, Height, Margin, Padding and Border</p>

    </header>


    <main>

        <section class="box-container">

            <div class="box">

                <h2>Content</h2>

                <p>
                    This section demonstrates the CSS Box Model.
                </p>

            </div>


            <div class="box">

                <h2>Padding</h2>

                <p>
                    Padding creates space inside an element.
                </p>

            </div>


            <div class="box">

                <h2>Margin</h2>

                <p>
                    Margin creates space outside an element.
                </p>

            </div>

        </section>


        <section class="info">

            <h2>Box Model Components</h2>

            <ul>

                <li>Content</li>
                <li>Padding</li>
                <li>Border</li>
                <li>Margin</li>

            </ul>

        </section>

    </main>

</body>

</html>
